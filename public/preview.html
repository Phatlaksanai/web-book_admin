<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Book Preview | Flipbook</title>
  
  <!-- Bootstrap 5 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Custom CSS -->
  <link rel="stylesheet" href="css/y2k.css" />

  <style>
    body {
      background-color: #2c3e50; /* สีพื้นหลังทึบเพื่อให้หนังสือเด่น */
      margin: 0;
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    #flipbook {
      width: 900px;
      height: 600px;
      transition: margin-left 0.2s;
    }

    #flipbook .page {
      background-color: white;
      background-size: 100% 100%;
      box-shadow: 0 0 20px rgba(0,0,0,0.3);
    }

    .controls {
      margin-top: 20px;
      background: rgba(0,0,0,0.6);
      padding: 10px 25px;
      border-radius: 50px;
      color: white;
      display: flex;
      gap: 15px;
      align-items: center;
      z-index: 100;
    }
  </style>
</head>
<body>

  <!-- Flipbook Container -->
  <div id="flipbook"></div>

  <!-- Controls -->
  <div class="controls">
    <a href="/library.html" class="btn btn-sm btn-outline-light rounded-pill px-3">Back</a>
    <button class="btn btn-sm btn-light rounded-circle" onclick="prevPage()">❮</button>
    <span class="mx-2 d-flex align-items-center gap-2">
      <input type="number" id="page-input" class="form-control form-control-sm text-center p-1" value="1" min="1" style="width: 60px;">
      <span>/</span>
      <span id="page-total">--</span>
    </span>
    <button class="btn btn-sm btn-light rounded-circle" onclick="nextPage()">❯</button>
    <button class="btn btn-sm btn-outline-light ms-3" onclick="toggleDisplay()">📖 View</button>
  </div>

  <!-- Scripts: jQuery & Turn.js -->
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/turn.js/3/turn.min.js"></script>
  <script src="js/preview.js"></script>
</body>
</html>
