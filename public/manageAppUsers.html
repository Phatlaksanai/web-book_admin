<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Manage App Users | Star Up</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/y2k.css" id="theme-link" />
</head>
<body class="bg-light">

  <div id="navbar"></div>

  <div class="container mt-5 mb-5" style="max-width: 1200px;">
    <div class="d-flex justify-content-between align-items-center mb-4">
      <div>
        <h2 class="fw-bold text-dark">👥 จัดการผู้ใช้งานแอป (App Users)</h2>
        <p class="text-muted">รายการหนังสือที่ถูกผู้ใช้งานในแอปพลิเคชันครอบครอง (Redeemed Books)</p>
      </div>
      <a href="/dashboard.html" class="btn btn-outline-secondary">← กลับ Dashboard</a>
    </div>

    <div class="card shadow-sm border-0">
      <div class="card-body p-0">
        <div class="table-responsive">
          <table class="table table-hover align-middle mb-0">
            <thead class="bg-light">
              <tr>
                <th class="ps-4 py-3">ผู้ใช้งาน (User)</th>
                <th class="py-3">หนังสือ (Book)</th>
                <th class="py-3">รหัส (Code)</th>
                <th class="py-3">วันที่รับ (Redeemed Date)</th>
                <th class="py-3 text-end pe-4">จัดการ (Actions)</th>
              </tr>
            </thead>
            <tbody id="userTableBody">
              <tr><td colspan="5" class="text-center py-5">Loading...</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/settings.js"></script>
  <script src="js/layout.js"></script>

  <script>
    document.addEventListener('DOMContentLoaded', loadRedeemedCodes);

    async function loadRedeemedCodes() {
      try {
        const token = localStorage.getItem('token');
        const res = await fetch('/api/books/redeemed', {
          headers: { 'x-auth-token': token }
        });

        if (!res.ok) throw new Error('Failed to fetch data');

        const codes = await res.json();
        renderTable(codes);
      } catch (err) {
        console.error(err);
        document.getElementById('userTableBody').innerHTML = 
          `<tr><td colspan="5" class="text-center text-danger py-5">เกิดข้อผิดพลาด: ${err.message}</td></tr>`;
      }
    }

    function renderTable(codes) {
      const tbody = document.getElementById('userTableBody');
      tbody.innerHTML = '';

      if (codes.length === 0) {
        tbody.innerHTML = `<tr><td colspan="5" class="text-center text-muted py-5">ยังไม่มีการใช้งานรหัสหนังสือ</td></tr>`;
        return;
      }

      codes.forEach(item => {
        const userEmail = item.user ? item.user.email : '<span class="text-muted">Unknown User</span>';
        const userPic = item.user && item.user.profilePic ? item.user.profilePic : 'https://via.placeholder.com/40';
        const userId = item.user ? item.user._id : null;
        
        const bookTitle = item.bookId ? item.bookId.title : item.bookTitle;
        const bookCover = item.bookId && item.bookId.coverImage ? item.bookId.coverImage.url : '';

        const date = new Date(item.updatedAt).toLocaleDateString('th-TH', {
          year: 'numeric', month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit'
        });

        const row = `
          <tr>
            <td class="ps-4">
              <div class="d-flex align-items-center">
                <img src="${userPic}" class="rounded-circle me-3" width="40" height="40" style="object-fit:cover;">
                <span class="fw-bold text-dark">${userEmail}</span>
              </div>
            </td>
            <td>
              <div class="d-flex align-items-center">
                ${bookCover ? `<img src="${bookCover}" class="rounded me-2" width="30" height="40" style="object-fit:cover;">` : ''}
                <span>${bookTitle}</span>
              </div>
            </td>
            <td><code class="bg-light px-2 py-1 rounded border">${item.code}</code></td>
            <td class="text-secondary">${date}</td>
            <td class="text-end pe-4">
              <button class="btn btn-sm btn-outline-danger" onclick="revokeAccess('${item._id}')">
                ดึงคืน (Revoke)
              </button>
              ${userId ? `<button class="btn btn-sm btn-danger ms-2" onclick="deleteAppUser('${userId}')">ลบผู้ใช้</button>` : ''}
            </td>
          </tr>
        `;
        tbody.insertAdjacentHTML('beforeend', row);
      });
    }

    async function revokeAccess(codeId) {
      if (!confirm('คุณต้องการดึงหนังสือเล่มนี้คืนจากผู้ใช้ใช่หรือไม่?\n(ผู้ใช้จะไม่สามารถอ่านหนังสือเล่มนี้ได้อีกจนกว่าจะกรอกรหัสใหม่)')) return;

      try {
        const token = localStorage.getItem('token');
        const res = await fetch(`/api/books/revoke/${codeId}`, {
          method: 'POST',
          headers: { 'x-auth-token': token }
        });

        if (res.ok) {
          alert('ดึงคืนสำเร็จ');
          loadRedeemedCodes(); // Reload table
        } else {
          alert('เกิดข้อผิดพลาด');
        }
      } catch (err) { console.error(err); }
    }

    async function deleteAppUser(userId) {
      if (!confirm('⚠️ คำเตือน: คุณต้องการลบผู้ใช้งานรายนี้ออกจากระบบถาวรใช่หรือไม่?')) return;

      try {
        const token = localStorage.getItem('token');
        const res = await fetch(`/api/books/app-users/${userId}`, {
          method: 'DELETE',
          headers: { 'x-auth-token': token }
        });

        if (res.ok) {
          alert('ลบผู้ใช้งานเรียบร้อยแล้ว');
          loadRedeemedCodes();
        } else {
          alert('เกิดข้อผิดพลาดในการลบผู้ใช้');
        }
      } catch (err) { console.error(err); }
    }
  </script>
</body>
</html>
