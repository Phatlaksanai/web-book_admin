<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Librarian | Add Book</title>
  <!-- Bootstrap 5 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Custom CSS -->
  <link rel="stylesheet" href="css/y2k.css" id="theme-link" />
</head>
<body class="bg-light">

  <!-- Navbar -->
  <div id="navbar"></div>

  <!-- Main Content -->
  <div class="main-content">
    <div class="container mt-5 mb-5" style="max-width: 800px;">
      
      <div class="text-center mb-4">
        <h2 class="fw-bold" id="pageTitle">📖 เพิ่มหนังสือใหม่</h2>
        <p class="text-muted">กรอกข้อมูลหนังสือเพื่อนำเข้าสู่ระบบ</p>
      </div>

      <div class="card shadow-sm">
        <div class="card-body p-4">
          <form onsubmit="event.preventDefault(); submitBook();">
            
            <!-- Title -->
            <div class="mb-3">
              <label class="form-label fw-bold">ชื่อหนังสือ</label>
              <input type="text" id="title" class="form-control" placeholder="ระบุชื่อหนังสือ..." required>
            </div>

            <!-- Detail -->
            <div class="mb-3">
              <label class="form-label fw-bold">รายละเอียด</label>
              <textarea id="detail" class="form-control" rows="4" placeholder="รายละเอียดโดยย่อ..." required></textarea>
            </div>

            <!-- Tags -->
            <div class="mb-3">
              <label class="form-label fw-bold">Tags</label>
              <input type="text" id="tags" class="form-control" placeholder="คั่นด้วยเครื่องหมายจุลภาค (,) เช่น นิยาย, การ์ตูน, ...">
            </div>

            <div class="row">
              <!-- Cover -->
              <div class="col-md-6 mb-3">
                <label class="form-label fw-bold">รูปปก (Cover)</label>
                <input type="file" id="cover" class="form-control" accept="image/*">
                <div class="mt-3 text-center bg-light border p-2 d-flex align-items-center justify-content-center" style="height: 200px;">
                  <img id="coverPreview" src="/images/default-cover.png" style="max-height: 100%; max-width: 100%; display: none;" alt="Preview">
                  <span class="text-muted small" id="previewText">Preview</span>
                </div>
              </div>

              <!-- PDF -->
              <div class="col-md-6 mb-3">
                <label class="form-label fw-bold">ไฟล์ PDF</label>
                <input type="file" id="pdf" class="form-control" accept="application/pdf">
                <small class="text-muted d-block mt-2" id="pdfFileName"></small>
                <div class="alert alert-info mt-3 small border-0 bg-light text-dark">
                  ℹ️ รองรับไฟล์ PDF เท่านั้น
                </div>
              </div>
            </div>

            <hr class="my-4">

            <div class="d-flex justify-content-between align-items-center">
              <div id="create-message" class="fw-bold"></div>
              <button type="submit" id="submitBtn" class="btn btn-primary px-4">บันทึกข้อมูล</button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>

  <!-- Footer -->
  <div id="footer"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/settings.js"></script>
  <script src="js/layout.js"></script>
  <script>
    const token = localStorage.getItem('token');
    const urlParams = new URLSearchParams(window.location.search);
    const bookId = urlParams.get('id');

    // Check if Edit Mode
    if (bookId) {
      document.getElementById('pageTitle').innerText = '✏️ แก้ไขหนังสือ (Edit Book)';
      document.title = 'Librarian | Edit Book';
      document.getElementById('submitBtn').innerText = 'บันทึกการแก้ไข';
      loadBookData(bookId);
    }

    // Preview Cover
    document.getElementById('cover').addEventListener('change', function(e) {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = function(e) {
          const img = document.getElementById('coverPreview');
          img.src = e.target.result;
          img.style.display = 'block';
          document.getElementById('previewText').style.display = 'none';
        }
        reader.readAsDataURL(file);
      }
    });

    async function loadBookData(id) {
      try {
        const res = await fetch(`/api/books/${id}`, { headers: { 'x-auth-token': token } });
        if (!res.ok) throw new Error('Failed to fetch book');
        const book = await res.json();

        document.getElementById('title').value = book.title || '';
        document.getElementById('detail').value = book.detail || book.description || '';
        document.getElementById('tags').value = (book.tags || book.category) ? (book.tags || book.category).join(', ') : '';

        if (book.coverImage && book.coverImage.url) {
          const img = document.getElementById('coverPreview');
          img.src = book.coverImage.url;
          img.style.display = 'block';
          document.getElementById('previewText').style.display = 'none';
        }
        
        const pdfData = book.pdfFile || book.file;
        if (pdfData) {
          document.getElementById('pdfFileName').innerText = `📄 ไฟล์ปัจจุบัน: ${pdfData.fileName || (pdfData.url ? pdfData.url.split('/').pop() : 'Existing PDF')}`;
        }
      } catch (err) { console.error(err); }
    }

    async function submitBook() {
      const formData = new FormData();
      formData.append('title', document.getElementById('title').value);
      formData.append('detail', document.getElementById('detail').value);
      formData.append('tags', document.getElementById('tags').value);
      
      const cover = document.getElementById('cover').files[0];
      const pdf = document.getElementById('pdf').files[0];

      if (cover) formData.append('cover', cover);
      if (pdf) formData.append('pdf', pdf);

      const url = bookId ? `/api/books/${bookId}` : '/api/books';
      const method = bookId ? 'PUT' : 'POST';

      const res = await fetch(url, { method, headers: { 'x-auth-token': token }, body: formData });
      if (res.ok) { alert('บันทึกสำเร็จ'); window.location.href = '/library.html'; }
      else { alert('เกิดข้อผิดพลาด'); }
    }
  </script>
</body>
</html>
