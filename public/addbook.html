<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Add Book | Library Admin</title>

  <!-- Bootstrap -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />

  <!-- Custom CSS -->
  <link rel="stylesheet" href="css/style.css" />
</head>

<body>

  <!-- ================= NAVBAR (ใช้ layout.js) ================= -->
  <div id="navbar"></div>


  <!-- ================= MAIN CONTENT ================= -->
  <div class="main-content">

    <div class="container py-4" style="max-width:720px;">

      <!-- ===== Title ===== -->
      <div class="text-center mb-4">
        <h2 id="pageTitle" class="fw-bold">📘 Add Book</h2>
        <p class="text-muted mb-0">เพิ่มหนังสือเข้าสู่ระบบ</p>
      </div>


      <!-- ===== Card ===== -->
      <div class="card shadow-sm">
        <div class="card-body p-4">

          <p id="create-message" class="text-success fw-bold text-center"></p>

          <!-- Book Title -->
          <div class="mb-3">
            <label class="form-label fw-semibold">Book Title</label>
            <input
              id="title"
              type="text"
              class="form-control"
              placeholder="Enter book title"
            />
          </div>


          <!-- Cover -->
          <div class="mb-3">
            <label class="form-label fw-semibold">Book Cover</label>
            <input
              id="cover"
              type="file"
              class="form-control"
              accept="image/*"
            />

            <div class="text-center mt-3">
              <img
                id="coverPreview"
                style="max-width:160px; display:none; border-radius:12px;"
                class="shadow-sm"
              />
            </div>
          </div>


          <!-- Detail -->
          <div class="mb-3">
            <label class="form-label fw-semibold">Detail</label>
            <textarea
              id="detail"
              rows="4"
              class="form-control"
              placeholder="Enter book detail..."
            ></textarea>
          </div>


          <!-- PDF -->
          <div class="mb-4">
            <label class="form-label fw-semibold">Book PDF</label>
            <input
              id="pdf"
              type="file"
              class="form-control"
              accept="application/pdf"
            />
            <small id="pdfFileName" class="text-muted"></small>
          </div>


          <!-- Submit -->
          <button 
            id="submitBtn" 
            class="btn btn-primary w-100"
            onclick="submitBook()"
          >
            Create Book
          </button>

        </div>
      </div>

    </div>
  </div>


  <!-- ================= FOOTER ================= -->
  <div id="footer"></div>


  <!-- ================= JS ================= -->
  <script src="js/layout.js"></script>
  <script src="js/main.js"></script>

  <!-- Preview Cover -->
  <script>
    const coverInput = document.getElementById("cover");
    const preview = document.getElementById("coverPreview");

    coverInput.addEventListener("change", () => {
      const file = coverInput.files[0];
      if (!file) return;

      preview.src = URL.createObjectURL(file);
      preview.style.display = "block";
    });

    // แสดงชื่อไฟล์ PDF
    document.getElementById("pdf").addEventListener("change", function () {
      document.getElementById("pdfFileName").textContent =
        this.files[0]?.name || "";
    });
  </script>

  <!-- Bootstrap -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
