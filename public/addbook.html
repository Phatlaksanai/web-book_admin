<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Admin | Book Code</title>

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Custom CSS -->
  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="bg-light">

<!-- ================= Navbar ================= -->
<div id="navbar"></div>
<!-- ================= Content ================= -->
<div class="main-content">
  <div class="container mt-5" style="max-width:720px;">
    <!-- ===== TITLE ===== -->
    <div class="text-center mb-4">
      <h2 class="fw-bold">📘 Add Book</h2>
      <p class="text-muted">เพิ่มหนังสือเข้าสู่ระบบ</p>
    </div>
    <!-- ===== FORM CARD ===== -->
    <div class="card shadow-sm">
      <div class="card-body p-4">

        <p id="create-message" class="text-center fw-bold text-success"></p>

        <!-- Title -->
        <div class="mb-4">
          <label class="form-label fw-semibold">Book Title</label>
          <input id="title" class="form-control" placeholder="Enter book title" />
        </div>


        <!-- Cover -->
        <div class="mb-4">
          <label class="form-label fw-semibold">Book Cover</label>

          <input type="file" id="cover" class="form-control" accept="image/*" />

          <div class="text-center mt-3">
            <img
              id="coverPreview"
              style="max-width:160px; border-radius:12px; display:none;"
              class="shadow-sm"
            />
          </div>
        </div>

        <!-- Detail -->
        <div class="mb-3">
          <label class="form-label">Detail</label>
          <textarea
            id="detail"
            class="form-control"
            rows="4"
            placeholder="Enter book detail..."
          ></textarea>
        </div>

        <!-- Book PDF -->
        <div class="mb-3">
          <label class="form-label">Book PDF</label>
          <input type="file" id="pdf" class="form-control" accept="application/pdf" />
          <small id="pdfFileName" class="text-muted"></small>
        </div>

        <button id="submitBtn" class="btn btn-primary w-100" onclick="submitBook()">
          Create Book
        </button>
      </div>
    </div>
  </div>
</div>

<div id="footer"></div>

<script src="js/layout.js"></script>
<script src="js/main.js"></script>

<!-- แสดงชื่อไฟล์ PDF -->
<script>
  document.getElementById("pdf").addEventListener("change", function () {
    document.getElementById("pdfFileName").textContent =
      this.files[0]?.name || "";
  });
</script>

</body>
</html>
