<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Welcome | Star Up</title>
  
  <!-- Bootstrap 5 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Custom CSS -->
  <link rel="stylesheet" href="css/style.css">

  <style>
    body {
      margin: 0;
      overflow: hidden;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    #vanta-bg {
      position: absolute;
      width: 100%;
      height: 100%;
      z-index: -1;
    }

    .welcome-container {
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
    }

    .welcome-card {
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 3rem;
      border-radius: 24px;
      text-align: center;
      max-width: 500px;
      width: 90%;
      box-shadow: 0 20px 50px rgba(0,0,0,0.3);
      animation: fadeIn 1s ease-out;
    }

    .welcome-title {
      font-size: 2.5rem;
      font-weight: 700;
      margin-bottom: 1rem;
      background: linear-gradient(to right, #fff, #a5c9ff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .welcome-desc {
      color: #cbd5e1;
      margin-bottom: 2rem;
      font-size: 1.1rem;
      line-height: 1.6;
    }

    .btn-custom {
      padding: 12px 30px;
      border-radius: 50px;
      font-weight: 600;
      transition: all 0.3s ease;
      text-transform: uppercase;
      letter-spacing: 1px;
      font-size: 0.9rem;
    }

    .btn-primary-custom {
      background: linear-gradient(135deg, #6aa9ff 0%, #4389f0 100%);
      border: none;
      color: white;
      box-shadow: 0 4px 15px rgba(67, 137, 240, 0.4);
    }
    .btn-primary-custom:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(67, 137, 240, 0.6);
      color: white;
    }

    .btn-outline-custom {
      background: transparent;
      border: 2px solid rgba(255,255,255,0.3);
      color: white;
    }
    .btn-outline-custom:hover {
      background: rgba(255,255,255,0.1);
      border-color: white;
      color: white;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
  <script>
    // ถ้ามี token ให้ไป dashboard เลย
    if (localStorage.getItem('token')) {
      window.location.href = 'dashboard.html';
    }
  </script>
</head>
<body>

<!-- Vanta Background -->
<div id="vanta-bg"></div>

<div class="welcome-container">
  <div class="welcome-card">
    <h1 class="welcome-title">Star Up Librarian</h1>
    <p class="welcome-desc">
      ระบบจัดการหนังสือและคลังความรู้อัจฉริยะ<br>
      Book Management & Library System
    </p>

    <!-- Features / Selling Points -->
    <div class="row text-start mb-4 g-2 justify-content-center">
      <div class="col-auto">
        <span class="badge bg-white text-primary bg-opacity-10 border border-white border-opacity-25 px-3 py-2 rounded-pill">
          📊 สรุปภาพรวม (Dashboard)
        </span>
      </div>
      <div class="col-auto">
        <span class="badge bg-white text-primary bg-opacity-10 border border-white border-opacity-25 px-3 py-2 rounded-pill">
          🔍 ค้นหาอัจฉริยะ (Smart Search)
        </span>
      </div>
      <div class="col-auto">
        <span class="badge bg-white text-primary bg-opacity-10 border border-white border-opacity-25 px-3 py-2 rounded-pill">
          📱 ติดตามสถานะ (Tracking)
        </span>
      </div>
    </div>
    
    <div class="d-flex flex-column gap-3">
      <a href="login.html" class="btn btn-custom btn-primary-custom text-decoration-none">
        เข้าสู่ระบบ (Login)
      </a>
      <!-- <a href="register.html" class="btn btn-custom btn-outline-custom text-decoration-none">
        ลงทะเบียน (Register)
      </a> -->
      <!-- Download App Button (Hidden by default) -->
      <a id="downloadAppBtn" href="#" target="_blank" class="btn btn-custom btn-outline-custom text-decoration-none border-info text-info" style="display: none;">
        📱 ดาวน์โหลดแอป (Download App)
      </a>
    </div>

    <div class="mt-4 text-white-50 small">
      &copy; 2024 Star Up Project
    </div>
  </div>
</div>

<!-- Three.js -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
<!-- Vanta Birds -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/vanta/0.5.24/vanta.birds.min.js"></script>

<script>
VANTA.BIRDS({
  el: "#vanta-bg",

  mouseControls: true,
  touchControls: true,
  gyroControls: false,

  backgroundColor: 0x0b0f14,
  color1: 0x6aa9ff,
  color2: 0xbfd7ff,

  birdSize: 1.0,
  wingSpan: 20,
  speedLimit: 2.5,
  separation: 60,
  alignment: 40,
  cohesion: 40,
  quantity: 4,

  scale: 1.0,
  scaleMobile: 0.8
})

// ✅ Fetch Download Link
fetch('/api/settings/download-link')
  .then(res => res.json())
  .then(data => {
    if (data.link && data.link.trim() !== '') {
      const btn = document.getElementById('downloadAppBtn');
      btn.href = data.link;
      btn.style.display = 'block';
    }
  });
</script>

</body>
</html>
