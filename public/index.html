<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Admin | Book Code</title>

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Custom CSS -->
  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="bg-light">

<!-- ================= Navbar ================= -->
<div id="navbar"></div>
<!-- ================= Content ================= -->
<div class="main-content">
  <div class="container mt-5" style="max-width:1100px;">
    <!-- ===== TITLE ===== -->
    <div class="text-center mb-4">
      <h2 class="fw-bold">📊 Dashboard</h2>
      <p class="text-muted">ภาพรวมการจัดการหนังสือในระบบ</p>
    </div>
    <!-- ===== STATS ===== -->
    <div class="row g-4 mb-4">
      <div class="col-md-6">
        <div class="card shadow-sm text-center h-100">
          <div class="card-body">
            <h6 class="text-muted mb-2">📚 Books in System</h6>
            <h2 id="totalBooks" class="fw-bold">0</h2>
          </div>
        </div>
      </div>
      <div class="col-md-6">
        <div class="card shadow-sm text-center h-100">
          <div class="card-body">
            <h6 class="text-muted mb-2">📖 My Added Books</h6>
            <h2 id="myBooks" class="fw-bold">0</h2>
          </div>
        </div>
      </div>
    </div>
    <!-- ===== HISTORY TABLE ===== -->
    <div class="card shadow-sm">
      <div class="card-body">
        <h5 class="mb-3">🕒 Add History</h5>
        <div class="table-responsive">
          <table class="table table-striped table-hover align-middle">
            <thead class="table-dark">
              <tr>
                <th>Title</th>
                <th>Date</th>
              </tr>
            </thead>

            <tbody id="historyTable"></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- ✅ Footer (shared) -->
<div id="footer"></div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/layout.js"></script>
<script src="js/main.js"></script>

</body>
</html>
