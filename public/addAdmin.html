<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Add Admin</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="css/style.css">
</head>

<body class="bg-login">

<!-- ================= Navbar ================= -->
<div id="navbar"></div>

<!-- ================= Content ================= -->
<div class="main-content">

  <div class="auth-container">
    <div class="auth-header">
      <h1>Add Admin</h1>
    </div>

    <div class="auth-content">
      <form id="registerForm">
        <div class="form-group">
          <label for="email">Email</label>
          <input
            id="email"
            name="email"
            type="email"
            placeholder="admin@email.com"
            required
          >
        </div>

        <button type="submit" class="btn w-100">Send</button>
      </form>

      <div id="result" class="mt-2"></div>
    </div>
  </div>

</div>

<!-- ================= Footer ================= -->
<div id="footer"></div>

<!-- ================= Scripts ================= -->
<script src="js/layout.js"></script>

<script>
document.getElementById("registerForm").addEventListener("submit", async function (e) {
  e.preventDefault(); // ❗ สำคัญมาก

  const emailInput = document.getElementById("email");
  const resultBox = document.getElementById("result");
  const email = emailInput.value.trim();

  if (!email) {
    resultBox.className = "text-danger";
    resultBox.innerText = "กรุณากรอก email";
    return;
  }

  try {
    const res = await fetch("/api/admin/add", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({ email })
    });

    const data = await res.json();

    if (res.ok) {
      resultBox.className = "text-success";
      resultBox.innerText = "ส่งข้อมูลสำเร็จ";
      emailInput.value = "";
    } else {
      resultBox.className = "text-danger";
      resultBox.innerText = data.message || "เกิดข้อผิดพลาด";
    }
  } catch (err) {
    resultBox.className = "text-danger";
    resultBox.innerText = "เชื่อมต่อเซิร์ฟเวอร์ไม่ได้";
  }
});
</script>

</body>
</html>
