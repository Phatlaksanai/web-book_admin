<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin | Library</title>
  <!-- Bootstrap 5 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Custom CSS -->
  <link rel="stylesheet" href="css/y2k.css" id="theme-link" />
</head>
<body class="bg-light">

  <!-- Navbar -->
  <div id="navbar"></div>

  <!-- Main Content -->
  <div class="main-content">
    <div class="container mt-5 mb-5" style="max-width: 1200px;">
      
      <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="fw-bold">📚 คลังหนังสือ</h2>
        <a href="/addbook" class="btn btn-primary shadow-sm">+ เพิ่มหนังสือ</a>
      </div>

      <!-- Search -->
      <div class="mb-4">
        <input type="text" id="searchInput" class="form-control" placeholder="🔍 ค้นหาชื่อหนังสือ หรือ รายละเอียด...">
        <div class="mt-2 d-flex gap-2 align-items-center flex-wrap">
          <span class="text-muted small">Tags:</span>
          <button class="btn btn-sm btn-outline-primary rounded-pill px-3" onclick="setSearch('Manga')">Manga</button>
          <button class="btn btn-sm btn-outline-primary rounded-pill px-3" onclick="setSearch('Novel')">Novel</button>
          <button class="btn btn-sm btn-outline-primary rounded-pill px-3" onclick="setSearch('Sci-Fi')">Sci-Fi</button>
          <button class="btn btn-sm btn-outline-primary rounded-pill px-3" onclick="setSearch('Fantasy')">Fantasy</button>
        </div>
      </div>

      <!-- Book Grid -->
      <div id="book-list" class="row g-4">
        <div class="col-12 text-center py-5 text-muted">Loading...</div>
      </div>

    </div>
  </div>

  <!-- Footer -->
  <div id="footer"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/settings.js"></script>
  <script src="js/library.js"></script>
  <script src="js/layout.js"></script>
</body>
</html>
