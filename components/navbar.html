<!-- Settings Modal -->
<div class="modal fade" id="settingsModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content rounded-0 border-0 shadow">
      <div class="modal-header border-bottom-0">
        <h5 class="modal-title fw-bold">⚙️ Settings</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        
        <!-- Font Size -->
        <div class="mb-3">
          <label class="form-label fw-bold">ขนาดตัวอักษร (Size)</label>
          <input type="range" class="form-range" id="setting-fontSize" min="0.8" max="1.4" step="0.05" oninput="updateSetting('fontSize', this.value)">
        </div>

        <!-- Theme -->
        <div class="mb-3">
          <label class="form-label fw-bold">ธีม (Theme)</label>
          <select class="form-select" id="setting-theme" onchange="updateSetting('theme', this.value)">
            <option value="y2k">Y2K Style</option>
            <option value="swiss">Swiss Style</option>
          </select>
        </div>

        <!-- Font Family -->
        <div class="mb-3">
          <label class="form-label fw-bold">แบบอักษร (Font)</label>
          <select class="form-select" id="setting-fontFamily" onchange="updateSetting('fontFamily', this.value)">
            <option value="'Verdana', sans-serif">Verdana (Y2K Default)</option>
            <option value="'VT323', monospace">VT323 (Pixel)</option>
            <option value="'Press Start 2P', cursive">8-Bit</option>
            <option value="'Comic Sans MS', cursive">Comic Sans</option>
            <option value="'Inter', sans-serif">Inter (Swiss)</option>
            <option value="'Courier New', monospace">Courier New</option>
            <option value="'Georgia', serif">Georgia</option>
            <option value="'Tahoma', sans-serif">Tahoma</option>
            <option value="'Dancing Script', cursive">Dancing Script</option>
          </select>
        </div>

      </div>
      <div class="modal-footer border-top-0">
        <button type="button" class="btn btn-secondary btn-sm" onclick="resetSettings()">Reset Default</button>
        <button type="button" class="btn btn-primary btn-sm" data-bs-dismiss="modal">Done</button>
      </div>
    </div>
  </div>
</div>
